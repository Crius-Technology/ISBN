[project]
name = "isbn-db"
version = "0.1.0"
description = "Acquire, normalize and analyze ISBN / book metadata from authoritative and trade sources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymarc>=5.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pycountry>=26.2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
isbn-db = "isbn_db.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isbn_db"]
force-include = { "src/isbn_db/data" = "isbn_db/data" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: tests hitting external sources or a database",
]
